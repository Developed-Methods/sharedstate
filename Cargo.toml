[package]
name = "sharedstate"
version = "4.0.0"
edition = "2024"
authors = ["Patrick Lorio <patrick@methods.dev>"]
description = "Sync heavily read state across many servers"
repository = "https://github.com/Developed-Methods/sharedstate"
license-file = "LICENSE.txt"

[dependencies]
base64 = { version = "=0.22.1" }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
serde_json = { version = "1" }
sha2 = { version = "0.10" }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7.12"
tracing = "0.1.40"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full", "test-util"] }

[[bin]]
name = "sharedstate-counter"
path = "tools/counter.rs"
